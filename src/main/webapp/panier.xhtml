<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="title">Mon Panier</ui:define>

    <ui:define name="content">
        <h2>Mon Panier d'Achat</h2>

        <h:panelGroup rendered="#{not empty panierBean.confirmationMessage}">
            <p style="color: green; font-weight: bold; padding: 10px; border: 1px solid green; background-color: #f9fff9;">
                #{panierBean.confirmationMessage}
            </p>
        </h:panelGroup>

        <h:panelGroup rendered="#{empty panierBean.articles}">
            <p>Votre panier est vide.</p>
            <p><h:link outcome="vitrine" value="Retourner à la vitrine" styleClass="btn"/></p>
        </h:panelGroup>

        <h:panelGroup rendered="#{not empty panierBean.articles}">
            <h:form id="panierTableForm">
                <table border="1" cellpadding="8" cellspacing="0" width="100%">
                    <thead>
                        <tr bgcolor="#f0f0f0">
                            <th>Produit</th>
                            <th>Prix unitaire</th>
                            <th>Quantité</th>
                            <th>Sous-total</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <ui:repeat value="#{panierBean.articles}" var="item">
                            <tr>
                                <td>
                                    <strong>#{item.produit.designation}</strong> (#{item.produit.categorie.nom})
                                </td>
                                <td>#{item.produit.prix} DH</td>
                                <td>
                                    <h:inputText type="number" value="#{item.quantite}" style="width: 50px;"/>
                                    <h:commandButton value="Modifier" action="#{panierBean.modifierQuantite(item.produit.id, item.quantite)}" style="margin-left: 5px;"/>
                                </td>
                                <td><strong>#{item.sousTotal} DH</strong></td>
                                <td align="center">
                                    <h:commandLink value="Supprimer" action="#{panierBean.supprimerArticle(item.produit.id)}" styleClass="btn"/>
                                </td>
                            </tr>
                        </ui:repeat>
                        <tr bgcolor="#f0f0f0">
                            <td colspan="3" align="right"><strong>Total général :</strong></td>
                            <td colspan="2"><strong>#{panierBean.total} DH</strong></td>
                        </tr>
                    </tbody>
                </table>
            </h:form>

            <div style="margin-top: 20px;">
                <table width="100%">
                    <tr>
                        <td align="left">
                            <h:form style="display: inline-block;">
                                <h:commandLink value="Vider le panier" action="#{panierBean.viderPanier}" styleClass="btn"/>
                            </h:form>
                        </td>
                        <td align="right">
                            <h:form style="display: inline-block;">
                                <h:outputLabel for="clientSelect" value="Client : " style="font-weight: bold;"/>
                                <h:selectOneMenu id="clientSelect" value="#{panierBean.selectedClientId}" required="true">
                                    <f:selectItem itemValue="" itemLabel="-- Choisir un client --"/>
                                    <f:selectItems value="#{panierBean.clients}" var="c" itemValue="#{c.id}" itemLabel="#{c.nom} #{c.prenom} (#{c.email})"/>
                                </h:selectOneMenu>
                                <h:commandButton value="Valider la commande"
                                                 action="#{panierBean.validerCommande}"
                                                 styleClass="btn-dark"
                                                 style="background-color: #000000 !important; color: #ffffff !important; border: 1px solid #000000 !important; padding: 6px 16px; font-weight: bold; cursor: pointer; border-radius: 3px; margin-left: 10px;"/>
                            </h:form>
                        </td>
                    </tr>
                </table>
            </div>
        </h:panelGroup>
    </ui:define>

</ui:composition>
