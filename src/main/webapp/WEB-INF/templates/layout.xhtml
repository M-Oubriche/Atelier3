<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <meta charset="UTF-8"/>
    <title><ui:insert name="title">E-Commerce JSF</ui:insert></title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        .btn {
            display: inline-block;
            border: 1px solid #000;
            background-color: #f0f0f0;
            color: #000 !important;
            padding: 3px 10px;
            text-decoration: none;
            font-size: 13px;
            border-radius: 3px;
            cursor: pointer;
            box-sizing: border-box;
            vertical-align: middle;
        }
        .btn:hover {
            background-color: #000;
            color: #fff !important;
        }

        .btn-dark, input[type="submit"].btn-dark, button.btn-dark {
            display: inline-block;
            border: 1px solid #000 !important;
            background-color: #000 !important;
            color: #ffffff !important;
            padding: 6px 16px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            border-radius: 3px;
            cursor: pointer;
        }
        .btn-dark:hover, input[type="submit"].btn-dark:hover, button.btn-dark:hover {
            background-color: #333333 !important;
            color: #ffffff !important;
        }

        button, input[type="submit"] {
            border: 1px solid #000;
            background-color: #f0f0f0;
            padding: 4px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
        }
        button:hover, input[type="submit"]:hover {
            background-color: #000;
            color: #fff;
        }
    </style>
</h:head>
<h:body>

    <!--nav Barre-->
    <div style="border-bottom: 2px solid #000; padding: 10px 0; margin-bottom: 20px; font-family: sans-serif;">
        <h:link outcome="vitrine" style="color: #000; margin-right: 20px; text-decoration: none; font-weight: bold;">Vitrine</h:link>
        <h:link outcome="panier" style="color: #000; margin-right: 20px; text-decoration: none; font-weight: bold;">Panier (#{panierBean.nombreArticles})</h:link>
        <h:link outcome="clients" style="color: #000; text-decoration: none; font-weight: bold;">Gestion Clients</h:link>
    </div>

    <ui:insert name="content"/>

</h:body>
</html>
